<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.webmanifest">
<title>AIRMAINT 360 Offline</title>
<style>
:root{--nav:#0f172a;--blue:#2563eb;--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--ok:#059669;--warn:#d97706;--bad:#dc2626}*{box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,Segoe UI,Roboto;color:var(--text);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:var(--nav);color:#fff;padding:15px 18px;position:sticky;top:0;z-index:5}.brand{font-weight:900;font-size:20px}.sub{font-size:12px;color:#94a3b8}.layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 72px)}nav{background:#fff;border-right:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:7px}.navbtn{border:0;background:transparent;text-align:left;padding:12px;border-radius:12px;font-weight:700;color:#475569}.navbtn.active{background:var(--blue);color:#fff}main{padding:24px;max-width:1300px;width:100%;margin:auto}.head{display:flex;align-items:center;gap:14px;margin-bottom:18px}.head h2{margin:0;font-size:24px}.head p{margin:4px 0;color:var(--muted)}.push{margin-left:auto}.primary,.dark,.danger,.ghost{border:0;border-radius:11px;padding:11px 15px;font-weight:800}.primary{background:var(--blue);color:#fff}.dark{background:var(--nav);color:#fff}.danger{background:var(--bad);color:#fff}.ghost{background:#fff;border:1px solid var(--border)}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(3,1fr)}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 2px 8px #0f172a08}.stat b{display:block;font-size:30px;margin-top:8px}.muted{color:var(--muted)}.row{display:flex;align-items:center;gap:12px}.list{display:flex;flex-direction:column;gap:10px}.item{background:#fff;border:1px solid var(--border);border-radius:15px;padding:15px}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900;background:#dbeafe;color:#1d4ed8}.badge.ok{background:#d1fae5;color:#047857}.badge.warn{background:#fef3c7;color:#a16207}.badge.bad{background:#fee2e2;color:#b91c1c}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-weight:800;font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}.field.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#020617aa;z-index:20;display:none;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.dialog{background:#fff;border-radius:20px;width:min(620px,100%);max-height:92vh;overflow:auto}.dialog-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center}.dialog-body{padding:18px}.close{margin-left:auto;border:0;background:#f1f5f9;border-radius:10px;padding:8px}.toast{position:fixed;right:18px;bottom:18px;background:#0f172a;color:#fff;padding:13px 17px;border-radius:13px;display:none;z-index:30}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:12px}.progress{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:10px}.progress span{display:block;height:100%;background:var(--blue)}table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}th,td{padding:12px;border-bottom:1px solid var(--border);text-align:left}th{font-size:12px;color:var(--muted)}@media(max-width:800px){.layout{grid-template-columns:1fr}.top{position:static}nav{position:sticky;top:0;z-index:4;flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--border)}.navbtn{white-space:nowrap}main{padding:16px}.stats,.cards{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}}@media(max-width:480px){.stats,.cards{grid-template-columns:1fr}.head{align-items:flex-start;flex-wrap:wrap}.push{margin-left:0;width:100%}.push button{width:100%}table{font-size:12px}}
</style></head>
<body><header class="top"><div class="brand">AIRMAINT 360</div><div class="sub">Mantenimiento de compresores · Standalone Offline</div></header><div class="layout"><nav id="nav"></nav><main id="app"></main></div><div id="modal" class="modal"><div class="dialog"><div class="dialog-head"><b id="modalTitle"></b><button class="close" onclick="closeModal()">✕</button></div><div id="modalBody" class="dialog-body"></div></div></div><div id="toast" class="toast"></div>
<script>
const seed={compressors:[{id:'c1',code:'COMP-24',name:'Compresor IR 250 #5',area:'Nave 8',brand:'Ingersoll Rand',model:'IR 250',current:38910,avg:18,status:'Operando',criticality:'A'},{id:'c2',code:'COMP-30',name:'Compresor IR 160 #30',area:'Nave 8',brand:'Ingersoll Rand',model:'IR 160',current:20844,avg:16,status:'Operando',criticality:'A'},{id:'c3',code:'COMP-12',name:'Compresor Atlas GA90',area:'Nave 3',brand:'Atlas Copco',model:'GA90',current:8450,avg:10,status:'En mantenimiento',criticality:'B'}],readings:[],maintenance:[{id:'m1',compressorId:'c1',name:'Cambio de aceite',lastHours:32000,interval:8000},{id:'m2',compressorId:'c2',name:'Lubricación motor principal',lastHours:19158,interval:2000},{id:'m3',compressorId:'c2',name:'Cambio de filtro de aceite',lastHours:19158,interval:1000},{id:'m4',compressorId:'c3',name:'Servicio general',lastHours:7000,interval:2000}],orders:[{id:'o1',folio:'OT-0001',compressorId:'c3',title:'Servicio general',priority:'Alta',status:'En proceso'}],inspections:[],failures:[],audit:[],settings:{company:'Empresa Industrial',warning:20,schedule:10,lastBackup:null}};
let db=load(),page='Inicio';const pages=['Inicio','Compresores','Horómetros','Mantenimiento','Órdenes','Inspecciones','Fallas','Alertas','Reportes','Configuración'];function load(){try{return JSON.parse(localStorage.getItem('airmaint360_v2'))||structuredClone(seed)}catch{return structuredClone(seed)}}function save(msg){localStorage.setItem('airmaint360_v2',JSON.stringify(db));if(msg)toast(msg);render()}function id(p){return p+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function comp(i){return db.compressors.find(c=>c.id===i)}function calc(m){const c=comp(m.compressorId),next=Number(m.lastHours)+Number(m.interval),remain=next-Number(c?.current||0),avail=m.interval?remain/m.interval*100:0;let state=remain<=0?'Vencido':avail<=db.settings.schedule?'Programar':avail<=db.settings.warning?'Próximo':'Normal';return{...m,c,next,remain,state,used:Math.max(0,Math.min(100,100-avail))}}function badge(s){const cl=s==='Normal'||s==='Operando'||s==='Cerrada'?'ok':s==='Vencido'||s==='Crítica'?'bad':s==='Próximo'||s==='Programar'||s==='En mantenimiento'?'warn':'';return `<span class="badge ${cl}">${esc(s)}</span>`}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2400)}function openModal(title,html){modalTitle.textContent=title;modalBody.innerHTML=html;modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}function head(t,d,b=''){return `<div class="head"><div><h2>${t}</h2><p>${d}</p></div>${b?`<div class="push">${b}</div>`:''}</div>`}
function renderNav(){nav.innerHTML=pages.map(p=>`<button class="navbtn ${p===page?'active':''}" onclick="page='${p}';render()">${p}${p==='Alertas'?` (${alerts().length})`:''}</button>`).join('')}function alerts(){return db.maintenance.map(calc).filter(x=>x.state!=='Normal')}function render(){renderNav();const f={Inicio:home,Compresores:compressors,'Horómetros':readings,Mantenimiento:maintenance,'Órdenes':orders,Inspecciones:inspections,Fallas:failures,Alertas:alertPage,Reportes:reports,'Configuración':settings};app.innerHTML=f[page]();}
function home(){const ms=db.maintenance.map(calc),a=alerts();return head('Panel principal','Resumen de operación y mantenimiento')+`<div class="grid stats">${[['Compresores',db.compressors.length],['Operando',db.compressors.filter(x=>x.status==='Operando').length],['Servicios vencidos',a.filter(x=>x.state==='Vencido').length],['Órdenes abiertas',db.orders.filter(x=>x.status!=='Cerrada').length]].map(x=>`<div class="card stat"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="card" style="margin-top:16px"><h3>Mantenimientos prioritarios</h3><div class="list">${ms.sort((a,b)=>a.remain-b.remain).map(m=>`<div class="item row"><div style="flex:1"><b>${esc(m.name)}</b><div class="muted small">${esc(m.c?.code)} · ${m.remain.toLocaleString()} h restantes</div></div>${badge(m.state)}</div>`).join('')}</div></div>`}
function compressors(){return head('Compresores','Catálogo de activos',`<button class="primary" onclick="compressorForm()">＋ Nuevo compresor</button>`)+`<div class="grid cards">${db.compressors.map(c=>`<div class="card"><div class="row"><b>${esc(c.code)}</b><span style="margin-left:auto">${badge(c.status)}</span></div><h3>${esc(c.name)}</h3><div class="muted">${esc(c.brand)} ${esc(c.model)} · ${esc(c.area)}</div><h2>${Number(c.current).toLocaleString()} h</h2><div class="small">Criticidad: <b>${esc(c.criticality)}</b></div></div>`).join('')}</div>`}
function compressorForm(){openModal('Nuevo compresor',`<form class="form" onsubmit="addCompressor(event)">${field('Código','code',true)}${field('Nombre','name',true)}${field('Área / Nave','area',true)}${field('Marca','brand')}${field('Modelo','model')}${field('Horómetro actual','current',true,'number')}${field('Horas promedio/día','avg',true,'number')}<div class="field"><label>Estado</label><select name="status"><option>Operando</option><option>En mantenimiento</option><option>Detenido</option><option>Fuera de servicio</option></select></div><div class="field"><label>Criticidad</label><select name="criticality"><option>A</option><option>B</option><option>C</option></select></div><div class="field full"><button class="primary">Guardar compresor</button></div></form>`)}function field(l,n,r=false,t='text'){return `<div class="field"><label>${l}</label><input name="${n}" type="${t}" ${r?'required':''}></div>`}function addCompressor(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(db.compressors.some(x=>x.code.toLowerCase()===f.code.toLowerCase()))return toast('El código ya existe');db.compressors.push({...f,id:id('c'),current:Number(f.current),avg:Number(f.avg)});audit('Crear','Compresor '+f.code);closeModal();save('Compresor registrado')}
function readings(){return head('Horómetros','Captura e historial',`<button class="primary" onclick="readingForm()">＋ Registrar lectura</button>`)+`<div class="card"><table><thead><tr><th>Fecha</th><th>Equipo</th><th>Lectura</th><th>Observaciones</th></tr></thead><tbody>${db.readings.map(r=>`<tr><td>${r.date}</td><td>${esc(comp(r.compressorId)?.code)}</td><td><b>${Number(r.value).toLocaleString()} h</b></td><td>${esc(r.notes)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No hay lecturas adicionales.</td></tr>'}</tbody></table></div>`}function readingForm(){openModal('Registrar horómetro',`<form class="form" onsubmit="addReading(event)"><div class="field full"><label>Compresor</label><select name="compressorId">${db.compressors.map(c=>`<option value="${c.id}">${esc(c.code)} · ${esc(c.name)} (${c.current} h)</option>`).join('')}</select></div>${field('Nueva lectura','value',true,'number')}${field('Fecha','date',true,'date')}<div class="field full"><label>Observaciones</label><textarea name="notes"></textarea></div><div class="field full"><button class="primary">Guardar y recalcular</button></div></form>`)}function addReading(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),c=comp(f.compressorId),v=Number(f.value);if(v<Number(c.current))return toast('La lectura no puede ser menor a la anterior');db.readings.unshift({...f,id:id('r'),value:v});c.current=v;audit('Crear','Lectura '+c.code+' '+v);closeModal();save('Horómetro actualizado')}
function maintenance(){return head('Mantenimiento','Cálculo automático por horómetro',`<button class="primary" onclick="maintenanceForm()">＋ Nueva actividad</button>`)+`<div class="list">${db.maintenance.map(calc).map(m=>`<div class="item row"><div style="flex:1"><div class="row"><b>${esc(m.name)}</b>${badge(m.state)}</div><div class="muted">${esc(m.c?.name)}</div><div class="small">Próximo: <b>${m.next.toLocaleString()} h</b> · Restan: <b>${m.remain.toLocaleString()} h</b></div><div class="progress"><span style="width:${m.used}%"></span></div></div><button class="dark" onclick="createOrder('${m.id}')">Crear OT</button></div>`).join('')}</div>`}function maintenanceForm(){openModal('Nueva actividad',`<form class="form" onsubmit="addMaintenance(event)"><div class="field full"><label>Compresor</label><select name="compressorId">${db.compressors.map(c=>`<option value="${c.id}">${esc(c.code)} · ${esc(c.name)}</option>`).join('')}</select></div>${field('Actividad','name',true)}${field('Último servicio (h)','lastHours',true,'number')}${field('Intervalo (h)','interval',true,'number')}<div class="field full"><button class="primary">Guardar actividad</button></div></form>`)}function addMaintenance(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));db.maintenance.push({...f,id:id('m'),lastHours:Number(f.lastHours),interval:Number(f.interval)});audit('Crear','Actividad '+f.name);closeModal();save('Actividad creada')}
function createOrder(mid){const m=calc(db.maintenance.find(x=>x.id===mid));db.orders.unshift({id:id('o'),folio:'OT-'+String(db.orders.length+1).padStart(4,'0'),compressorId:m.compressorId,maintenanceId:m.id,title:m.name,priority:m.state==='Vencido'?'Crítica':'Alta',status:'Nueva'});audit('Crear','Orden '+m.name);save('Orden creada')}function orders(){return head('Órdenes de trabajo','Seguimiento de actividades')+`<div class="grid cards">${db.orders.map(o=>`<div class="card"><div class="row"><b style="color:#2563eb">${esc(o.folio)}</b><span style="margin-left:auto">${badge(o.status)}</span></div><h3>${esc(o.title)}</h3><div class="muted">${esc(comp(o.compressorId)?.name)}</div><p>Prioridad: <b>${esc(o.priority)}</b></p>${o.status!=='Cerrada'?`<button class="primary" onclick="closeOrder('${o.id}')">Cerrar OT</button>`:''}</div>`).join('')}</div>`}function closeOrder(oid){const o=db.orders.find(x=>x.id===oid),c=comp(o.compressorId);openModal('Cerrar '+o.folio,`<form class="form" onsubmit="finishOrder(event,'${oid}')"><div class="field full"><label>Trabajo realizado</label><textarea name="work" required></textarea></div>${field('Horómetro de ejecución','hours',true,'number')}<div class="field full"><button class="primary">Cerrar y actualizar plan</button></div></form><p class="muted small">Horómetro actual: ${c.current} h</p>`)}function finishOrder(e,oid){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),o=db.orders.find(x=>x.id===oid);o.status='Cerrada';o.work=f.work;o.executionHours=Number(f.hours);o.closed=new Date().toISOString();if(o.maintenanceId){const m=db.maintenance.find(x=>x.id===o.maintenanceId);m.lastHours=Number(f.hours)}audit('Cerrar',o.folio);closeModal();save('Orden cerrada y plan actualizado')}
function inspections(){return head('Inspecciones','Checklist operativo',`<button class="primary" onclick="inspectionForm()">＋ Nueva inspección</button>`)+`<div class="list">${db.inspections.map(i=>`<div class="item"><div class="row"><b>${esc(comp(i.compressorId)?.name)}</b><span style="margin-left:auto">${badge(i.status)}</span></div><div class="muted">${i.date} · Cumplimiento ${i.score}%</div><p>${esc(i.finding||'Sin hallazgos')}</p></div>`).join('')||'<div class="card muted">No hay inspecciones registradas.</div>'}</div>`}function inspectionForm(){const qs=['Nivel de aceite correcto','Sin fugas de aceite','Sin fugas de aire','Presión normal','Temperatura normal','Sin ruido anormal','Sin vibración anormal','Enfriadores limpios','Área limpia','Guardas instaladas','LOTO disponible'];openModal('Nueva inspección',`<form onsubmit="addInspection(event)"><div class="field"><label>Compresor</label><select name="compressorId">${db.compressors.map(c=>`<option value="${c.id}">${esc(c.code)} · ${esc(c.name)}</option>`).join('')}</select></div><div class="list" style="margin-top:12px">${qs.map((q,i)=>`<div class="item row"><span style="flex:1">${q}</span><select name="q${i}"><option>Correcto</option><option>Incorrecto</option><option>No aplica</option></select></div>`).join('')}</div><div class="field"><label>Hallazgo / observación</label><textarea name="finding"></textarea></div><button class="primary" style="margin-top:12px">Guardar inspección</button></form>`)}function addInspection(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),ans=Object.entries(f).filter(x=>x[0].startsWith('q')).map(x=>x[1]),bad=ans.filter(x=>x==='Incorrecto').length;if(bad&&!f.finding)return toast('Describe el hallazgo detectado');db.inspections.unshift({id:id('i'),compressorId:f.compressorId,date:new Date().toISOString().slice(0,10),score:Math.round((ans.length-bad)/ans.length*100),finding:f.finding,status:bad?'Con hallazgo':'Correcta'});audit('Crear','Inspección');closeModal();save('Inspección guardada')}
function failures(){return head('Fallas y paros','Registro de eventos',`<button class="danger" onclick="failureForm()">＋ Reportar falla</button>`)+`<div class="list">${db.failures.map(f=>`<div class="item"><div class="row"><b>${esc(f.folio)} · ${esc(f.symptom)}</b><span style="margin-left:auto">${badge(f.status)}</span></div><div class="muted">${esc(comp(f.compressorId)?.name)} · ${f.date}</div><p>${esc(f.description)}</p></div>`).join('')||'<div class="card muted">No hay fallas registradas.</div>'}</div>`}function failureForm(){openModal('Reportar falla',`<form class="form" onsubmit="addFailure(event)"><div class="field full"><label>Compresor</label><select name="compressorId">${db.compressors.map(c=>`<option value="${c.id}">${esc(c.code)} · ${esc(c.name)}</option>`).join('')}</select></div>${field('Síntoma','symptom',true)}<div class="field"><label>Prioridad</label><select name="priority"><option>Media</option><option>Alta</option><option>Crítica</option></select></div><div class="field full"><label>Descripción</label><textarea name="description" required></textarea></div><div class="field full"><button class="danger">Registrar falla</button></div></form>`)}function addFailure(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));db.failures.unshift({...f,id:id('f'),folio:'F-'+String(db.failures.length+1).padStart(4,'0'),date:new Date().toISOString().slice(0,10),status:'Abierta'});audit('Crear','Falla '+f.symptom);closeModal();save('Falla registrada')}
function alertPage(){return head('Alertas','Condiciones que requieren atención')+`<div class="list">${alerts().map(a=>`<div class="item row"><div style="flex:1"><b>${esc(a.name)}</b><div class="muted">${esc(a.c?.name)} · ${a.remain.toLocaleString()} h restantes</div></div>${badge(a.state)}</div>`).join('')||'<div class="card muted">No hay alertas activas.</div>'}</div>`}
function reports(){return head('Reportes','Exportación de información')+`<div class="grid cards">${[['Compresores','compressors'],['Horómetros','readings'],['Mantenimiento','maintenance'],['Órdenes','orders'],['Inspecciones','inspections'],['Fallas','failures']].map(x=>`<div class="card"><h3>${x[0]}</h3><p class="muted">${db[x[1]].length} registros</p><button class="primary" onclick="csv('${x[1]}')">Descargar CSV</button></div>`).join('')}</div><div class="card" style="margin-top:14px"><b>Reporte PDF</b><p class="muted">Use Imprimir en el navegador y seleccione Guardar como PDF.</p><button class="ghost" onclick="window.print()">Imprimir / PDF</button></div>`}function csv(k){const rows=db[k];if(!rows.length)return toast('No hay registros');const keys=[...new Set(rows.flatMap(Object.keys))],data=[keys.join(','),...rows.map(r=>keys.map(q=>'"'+String(r[q]??'').replaceAll('"','""')+'"').join(','))].join('\n');download(k+'.csv',data,'text/csv')}
function settings(){return head('Configuración','Respaldo, restauración y datos locales')+`<div class="grid cards"><div class="card"><h3>Respaldo completo</h3><p class="muted">Exporta todos los registros en JSON.</p><button class="primary" onclick="backup()">Descargar respaldo</button></div><div class="card"><h3>Restaurar respaldo</h3><p class="muted">Importa un archivo generado por AIRMAINT 360.</p><label class="ghost" style="display:inline-block">Seleccionar JSON<input type="file" accept=".json" hidden onchange="restore(event)"></label></div><div class="card"><h3>Datos de demostración</h3><p class="muted">Restablece la base local.</p><button class="danger" onclick="resetDemo()">Restablecer</button></div></div><div class="card" style="margin-top:14px"><h3>Auditoría local</h3>${db.audit.slice(0,15).map(a=>`<div class="small" style="padding:7px 0;border-bottom:1px solid #e2e8f0"><b>${esc(a.action)}</b> · ${esc(a.detail)} · ${new Date(a.date).toLocaleString()}</div>`).join('')||'<p class="muted">Sin movimientos.</p>'}</div>`}function audit(action,detail){db.audit.unshift({id:id('a'),date:new Date().toISOString(),action,detail})}function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}function backup(){const pack={app:'AIRMAINT 360 Offline',version:'2.0',createdAt:new Date().toISOString(),data:db};download('AIRMAINT_Backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(pack,null,2),'application/json');db.settings.lastBackup=new Date().toISOString();audit('Exportar','Respaldo completo');save('Respaldo descargado')}function restore(e){const f=e.target.files[0],r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result);if(p.app!=='AIRMAINT 360 Offline'||!p.data)throw Error();db=p.data;audit('Restaurar','Respaldo');save('Respaldo restaurado')}catch{toast('Archivo de respaldo inválido')}};r.readAsText(f)}function resetDemo(){if(!confirm('¿Reemplazar todos los datos locales por la demostración?'))return;db=structuredClone(seed);save('Datos restaurados')}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
