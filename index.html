let db=load(),page='Inicio',selected=null;const P=['Inicio','Compresores','Horómetros','Mantenimiento','Órdenes','Inspecciones','Fallas','Refacciones','KPIs','Etiquetas QR','Alertas','Reportes','Configuración'];function clone(x){return JSON.parse(JSON.stringify(x))}function load(){try{return JSON.parse(localStorage.getItem('airmaint360_pro_v3'))||clone(S)}catch{return clone(S)}}function persist(msg){localStorage.setItem('airmaint360_pro_v3',JSON.stringify(db));if(msg)note(msg);render()}function uid(p){return p+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)}function x(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function c(id){return db.compressors.find(z=>z.id===id)}function accumulated(o){return Number(o?.physical||0)+Number(o?.offset||0)}function dates(s,e){if(!s||!e)return 0;return Math.max(0,(new Date(e)-new Date(s))/36e5)}function mc(m){const q=c(m.compressorId),now=accumulated(q),next=+m.lastHours + +m.interval,remain=next-now,avail=m.interval?remain/m.interval*100:0;let state=remain<=0?'Vencido':avail<=db.settings.schedule?'Programar':avail<=db.settings.warning?'Próximo':'Normal';const due=new Date(m.lastDate);due.setDate(due.getDate()+Number(m.days||0));if(m.days&&due<=new Date())state='Vencido';return{...m,q,now,next,remain,state,used:Math.max(0,Math.min(100,100-avail)),due:due.toISOString().slice(0,10)}}function tag(s){let k=['Normal','Operando','Cerrada','Correcta'].includes(s)?'ok':['Vencido','Crítica','Abierta'].includes(s)?'bad':['Próximo','Programar','En mantenimiento','En reparación','Con hallazgo'].includes(s)?'warn':'gray';return `<span class="tag ${k}">${x(s)}</span>`}function note(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',2300)}function audit(a,d){db.audit.unshift({id:uid('a'),date:new Date().toISOString(),action:a,detail:d})}function head(t,d,b=''){return `<div class="heading"><div><h1>${t}</h1><p>${d}</p></div>${b?`<div class="push">${b}</div>`:''}</div>`}function openM(t,h){mtitle.textContent=t;mbody.innerHTML=h;modal.classList.add('open')}function closeM(){modal.classList.remove('open')}function field(l,n,r=false,t='text',v=''){return `<div class="field"><label>${l}</label><input name="${n}" type="${t}" value="${x(v)}" ${r?'required':''}></div>`}function pick(l,n,a,v=''){return `<div class="field"><label>${l}</label><select name="${n}">${a.map(z=>`<option ${z===v?'selected':''}>${x(z)}</option>`).join('')}</select></div>`}function renderNav(){nav.innerHTML=P.map(p=>`<button class="nav ${p===page?'on':''}" onclick="page='${p}';render()">${p}${p==='Alertas'?`<span class="count">${alerts().length}</span>`:''}</button>`).join('')}function alerts(){return db.maintenance.map(mc).filter(z=>z.state!=='Normal').concat(db.parts.filter(p=>+p.stock<=+p.min).map(p=>({id:p.id,name:'Stock bajo: '+p.name,state:'Crítica',q:{name:p.location},remain:p.stock-p.min})))}function render(){renderNav();const M={Inicio:home,Compresores:compressors,'Horómetros':meters,Mantenimiento:maintenance,'Órdenes':orders,Inspecciones:inspections,Fallas:failures,Refacciones:parts,'KPIs':kpis,'Etiquetas QR':labels,Alertas:alertPage,Reportes:reports,'Configuración':settings};app.innerHTML=M[page]()}function stat(n,v,s=''){return `<div class="card stat kpi"><div class="mut small">${n}</div><div class="num">${v}</div><div class="mut small">${s}</div></div>`}
function metrics(){const closed=db.orders.filter(o=>o.status==='Cerrada').length,total=db.orders.length,down=db.failures.reduce((a,f)=>a+dates(f.start,f.end),0),closedFails=db.failures.filter(f=>f.end),mttr=closedFails.length?down/closedFails.length:0,period=720,availability=Math.max(0,(period-down)/period*100),pm=db.maintenance.length?closed/Math.max(1,db.maintenance.length)*100:0;return{down,mttr,availability,pm,closed,total}}
function home(){const m=metrics(),ms=db.maintenance.map(mc).sort((a,b)=>a.remain-b.remain);return head('Centro de control','Visión operativa y de confiabilidad')+`<div class="grid stats">${stat('Compresores',db.compressors.length,'activos registrados')}${stat('Disponibilidad',m.availability.toFixed(1)+'%','periodo de referencia local')}${stat('MTTR',m.mttr.toFixed(1)+' h','fallas cerradas')}${stat('Cumplimiento PM',m.pm.toFixed(0)+'%','OT cerradas / planes')}${stat('Horas de paro',m.down.toFixed(1),'eventos cerrados')}${stat('Costo refacciones','$'+db.parts.reduce((a,p)=>a+p.stock*p.cost,0).toLocaleString(),'valor en existencia')}</div><div class="grid" style="grid-template-columns:2fr 1fr;margin-top:14px"><div class="panel"><h3>Mantenimiento prioritario</h3><div class="list">${ms.map(z=>`<div class="item flex"><div style="flex:1"><b>${x(z.name)}</b><div class="mut small">${x(z.q?.code)} · ${z.remain.toLocaleString()} h · Fecha ${z.due}</div></div>${tag(z.state)}</div>`).join('')}</div></div><div class="panel"><h3>Alertas activas</h3><div class="list">${alerts().slice(0,8).map(a=>`<div class="item"><b>${x(a.name)}</b><div class="mut small">${x(a.q?.name||'Inventario')}</div></div>`).join('')||'<div class="mut">Sin alertas.</div>'}</div></div></div>`}
function compressors(){return head('Expediente técnico','Activos, fotografías, placa y especificaciones',`<button class="btn primary" onclick="compressorForm()">＋ Nuevo equipo</button>`)+`<div class="grid cards">${db.compressors.map(q=>`<div class="card" onclick="dossier('${q.id}')" style="cursor:pointer">${q.photo?`<img class="photo" src="${q.photo}">`:`<div class="photo" style="display:grid;place-items:center;font-size:50px">⚙️</div>`}<div class="flex" style="margin-top:12px"><b>${x(q.code)}</b><span style="margin-left:auto">${tag(q.status)}</span></div><h3>${x(q.name)}</h3><div class="mut">${x(q.brand)} ${x(q.model)} · ${x(q.area)}</div><h2>${accumulated(q).toLocaleString()} h</h2><div class="small">Físico ${q.physical} + Offset ${q.offset} · Criticidad ${q.criticality}</div></div>`).join('')}</div>`}
function compressorForm(){openM('Nuevo expediente',`<form class="form" onsubmit="addCompressor(event)">${field('Código','code',1)}${field('Nombre','name',1)}${field('Planta','plant',1)}${field('Área / Nave','area',1)}${field('Ubicación','location')}${field('Marca','brand')}${field('Modelo','model')}${field('Serie','serial')}${pick('Tipo','type',['Tornillo','Pistón','Centrífugo','Scroll'])}${field('Potencia HP','power',0,'number')}${field('Voltaje','voltage',0,'number')}${field('Presión PSI','pressure',0,'number')}${field('Caudal CFM','flow',0,'number')}${field('Aceite','oil')}${field('Fecha instalación','installDate',0,'date')}${field('Horómetro físico','physical',1,'number')}${field('Horas promedio/día','avg',1,'number')}${pick('Estado','status',['Operando','En mantenimiento','Detenido','Fuera de servicio'])}${pick('Criticidad','criticality',['A','B','C'])}<div class="field full"><label>Fotografía</label><input name="photo" type="file" accept="image/*" capture="environment"></div><div class="field full"><button class="btn primary">Guardar expediente</button></div></form>`)}async function img(file){if(!file)return'';const b=await file.arrayBuffer(),blob=new Blob([b]),url=URL.createObjectURL(blob),im=new Image();im.src=url;await im.decode();const max=900,k=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(url);return cv.toDataURL('image/jpeg',.72)}async function addCompressor(e){e.preventDefault();const fd=new FormData(e.target),f=Object.fromEntries(fd);if(db.compressors.some(q=>q.code.toLowerCase()===f.code.toLowerCase()))return note('El código ya existe');f.photo=await img(fd.get('photo'));['power','voltage','pressure','flow','physical','avg'].forEach(k=>f[k]=+f[k]||0);db.compressors.push({...f,id:uid('c'),offset:0});audit('Crear','Expediente '+f.code);closeM();persist('Compresor registrado')}
function dossier(cid){selected=cid;const q=c(cid),ms=db.maintenance.map(mc).filter(z=>z.compressorId===cid),rs=db.readings.filter(r=>r.compressorId===cid),os=db.orders.filter(o=>o.compressorId===cid),fs=db.failures.filter(f=>f.compressorId===cid);openM('Expediente '+q.code,`<div class="flex" style="align-items:flex-start">${q.photo?`<img src="${q.photo}" style="width:180px;height:135px;object-fit:cover;border-radius:15px">`:`<div class="machine">⚙</div>`}<div style="flex:1"><h2 style="margin:0">${x(q.name)}</h2><p class="mut">${x(q.brand)} ${x(q.model)} · Serie ${x(q.serial)}</p>${tag(q.status)} <span class="tag">Criticidad ${q.criticality}</span><h2>${accumulated(q).toLocaleString()} h</h2></div><div id="dossierQR" class="qrbox"></div></div><div class="tabs"><button class="tab on">Resumen</button><button class="tab">Mantenimiento ${ms.length}</button><button class="tab">OT ${os.length}</button><button class="tab">Fallas ${fs.length}</button></div><div class="grid cards"><div class="item"><b>Ubicación</b><div>${x(q.plant)} · ${x(q.area)} · ${x(q.location)}</div></div><div class="item"><b>Eléctrico</b><div>${q.power} HP · ${q.voltage} V</div></div><div class="item"><b>Operación</b><div>${q.pressure} PSI · ${q.flow} CFM</div></div><div class="item"><b>Horómetro</b><div>Físico ${q.physical} + Offset ${q.offset}</div></div><div class="item"><b>Lecturas</b><div>${rs.length} registros</div></div><div class="item"><b>Aceite</b><div>${x(q.oil)}</div></div></div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="closeM();readingForm('${q.id}')">Registrar horómetro</button><button class="btn light" onclick="meterChangeForm('${q.id}')">Cambiar horómetro</button><button class="btn light" onclick="window.print()">Imprimir ficha</button></div>`);setTimeout(()=>drawQR('dossierQR',qrPayload(q),150),30)}
function meters(){return head('Horómetros y offset','Lecturas físicas, acumuladas y reemplazos',`<button class="btn primary" onclick="readingForm()">＋ Nueva lectura</button>`)+`<div class="panel"><table><thead><tr><th>Fecha</th><th>Equipo</th><th>Físico</th><th>Offset</th><th>Acumulado</th><th>Observaciones</th></tr></thead><tbody>${db.readings.map(r=>`<tr><td>${r.date}</td><td>${x(c(r.compressorId)?.code)}</td><td>${r.physical}</td><td>${r.offset}</td><td><b>${r.accumulated}</b></td><td>${x(r.notes)}</td></tr>`).join('')||'<tr><td colspan="6" class="mut">Sin registros nuevos.</td></tr>'}</tbody></table></div><h3>Cambios de medidor</h3><div class="list">${db.meterChanges.map(m=>`<div class="item"><b>${x(c(m.compressorId)?.code)}</b> · ${m.date}<div class="mut small">Final anterior ${m.previousFinal} · Inicial nuevo ${m.newInitial} · Offset ${m.newOffset} · ${x(m.reason)}</div></div>`).join('')||'<div class="panel mut">No hay reemplazos.</div>'}</div>`}function readingForm(cid=''){openM('Registrar horómetro',`<form class="form" onsubmit="addReading(event)"><div class="field full"><label>Compresor</label><select name="compressorId">${db.compressors.map(q=>`<option value="${q.id}" ${q.id===cid?'selected':''}>${x(q.code)} · ${x(q.name)} (${q.physical}+${q.offset})</option>`).join('')}</select></div>${field('Lectura física','physical',1,'number')}${field('Fecha','date',1,'date',new Date().toISOString().slice(0,10))}<div class="field full"><label>Observaciones</label><textarea name="notes"></textarea></div><div class="field full"><button class="btn primary">Guardar y recalcular</button></div></form>`)}function addReading(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),q=c(f.compressorId),v=+f.physical;if(v<q.physical)return note('Lectura menor: use Cambio de horómetro');q.physical=v;db.readings.unshift({...f,id:uid('r'),physical:v,offset:q.offset,accumulated:v+q.offset});audit('Crear','Lectura '+q.code);closeM();persist('Lectura guardada')}
function meterChangeForm(cid){const q=c(cid);openM('Reemplazo de horómetro',`<form class="form" onsubmit="meterChange(event,'${cid}')">${field('Lectura final anterior','previousFinal',1,'number',q.physical)}${field('Lectura inicial nueva','newInitial',1,'number',0)}${field('Fecha','date',1,'date',new Date().toISOString().slice(0,10))}<div class="field full"><label>Motivo</label><textarea name="reason" required></textarea></div><div class="field full"><button class="btn danger">Registrar cambio y calcular offset</button></div></form>`)}function meterChange(e,cid){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),q=c(cid),acc=q.physical+q.offset,newOffset=acc-(+f.newInitial);db.meterChanges.unshift({...f,id:uid('mc'),compressorId:cid,previousFinal:+f.previousFinal,newInitial:+f.newInitial,newOffset});q.physical=+f.newInitial;q.offset=newOffset;audit('Cambio horómetro',q.code+' offset '+newOffset);closeM();persist('Horómetro reemplazado; continuidad conservada')}
function maintenance(){return head('Programa maestro','Rutinas por horas y calendario',`<button class="btn primary" onclick="maintForm()">＋ Nueva rutina</button>`)+`<div class="list">${db.maintenance.map(mc).map(m=>`<div class="item flex"><div style="flex:1"><div class="flex"><b>${x(m.code)} · ${x(m.name)}</b>${tag(m.state)}</div><div class="mut">${x(m.q?.name)}</div><div class="small">Próximo ${m.next.toLocaleString()} h · Restan ${m.remain.toLocaleString()} h · Fecha ${m.due} · ${m.estimated} HH</div><div class="bar"><i style="width:${m.used}%"></i></div></div><button class="btn dark" onclick="createOrder('${m.id}')">Crear OT</button></div>`).join('')}</div>`}function maintForm(){openM('Nueva rutina',`<form class="form" onsubmit="addMaint(event)"><div class="field full"><label>Compresor</label><select name="compressorId">${db.compressors.map(q=>`<option value="${q.id}">${x(q.code)} · ${x(q.name)}</option>`).join('')}</select></div>${field('Código','code',1)}${field('Actividad','name',1)}${field('Último servicio h','lastHours',1,'number')}${field('Intervalo h','interval',1,'number')}${field('Fecha último servicio','lastDate',1,'date')}${field('Frecuencia días','days',1,'number')}${field('Horas hombre estimadas','estimated',1,'number')}<div class="field full"><button class="btn primary">Guardar rutina</button></div></form>`)}function addMaint(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));['lastHours','interval','days','estimated'].forEach(k=>f[k]=+f[k]);db.maintenance.push({...f,id:uid('m')});audit('Crear','Rutina '+f.code);closeM();persist('Rutina creada')}
function createOrder(mid){const m=mc(db.maintenance.find(z=>z.id===mid));db.orders.unshift({id:uid('o'),folio:'OT-'+String(db.orders.length+1).padStart(4,'0'),compressorId:m.compressorId,maintenanceId:m.id,title:m.name,priority:m.state==='Vencido'?'Crítica':'Alta',status:'Nueva',laborHours:0,partsCost:0});audit('Crear','OT '+m.name);persist('Orden creada')}function orders(){return head('Órdenes profesionales','Ejecución, costos, evidencia y cierre')+`<div class="grid cards">${db.orders.map(o=>`<div class="card"><div class="flex"><b style="color:#0b6bcb">${o.folio}</b><span style="margin-left:auto">${tag(o.status)}</span></div><h3>${x(o.title)}</h3><div class="mut">${x(c(o.compressorId)?.name)}</div><p>Prioridad <b>${x(o.priority)}</b></p><div class="small">HH ${o.laborHours||0} · Refacciones $${Number(o.partsCost||0).toLocaleString()}</div>${o.evidence?`<img class="photo" style="margin-top:10px" src="${o.evidence}">`:''}<div class="actions" style="margin-top:12px">${o.status!=='Cerrada'?`<button class="btn primary" onclick="closeOrder('${o.id}')">Cerrar orden</button>`:''}</div></div>`).join('')}</div>`}function closeOrder(oid){const o=db.orders.find(z=>z.id===oid),q=c(o.compressorId);openM('Cerrar '+o.folio,`<form class="form" onsubmit="finishOrder(event,'${oid}')"><div class="field full"><label>Trabajo realizado</label><textarea name="work" required></textarea></div>${field('Horómetro ejecución','hours',1,'number',accumulated(q))}${field('Horas hombre','laborHours',1,'number')}${field('Costo refacciones','partsCost',1,'number')}<div class="field full"><label>Evidencia fotográfica</label><input name="evidence" type="file" accept="image/*" capture="environment"></div><div class="field full"><button class="btn primary">Cerrar y actualizar mantenimiento</button></div></form>`)}async function finishOrder(e,oid){e.preventDefault();const fd=new FormData(e.target),f=Object.fromEntries(fd),o=db.orders.find(z=>z.id===oid);Object.assign(o,{status:'Cerrada',work:f.work,executionHours:+f.hours,laborHours:+f.laborHours,partsCost:+f.partsCost,closed:new Date().toISOString(),evidence:await img(fd.get('evidence'))});if(o.maintenanceId){const m=db.maintenance.find(z=>z.id===o.maintenanceId);m.lastHours=+f.hours;m.lastDate=new Date().toISOString().slice(0,10)}audit('Cerrar',o.folio);closeM();persist('OT cerrada y plan actualizado')}
function inspections(){return head('Inspecciones','Checklist, hallazgos y evidencia',`<button class="btn primary" onclick="inspectionForm()">＋ Nueva inspección</button>`)+`<div class="list">${db.inspections.map(i=>`<div class="item flex"><div style="flex:1"><b>${x(c(i.compressorId)?.name)}</b><div class="mut">${i.date} · Cumplimiento ${i.score}%</div><div>${x(i.finding||'Sin hallazgos')}</div></div>${tag(i.status)}</div>`).join('')||'<div class="panel mut">Sin inspecciones.</div>'}</div>`}function inspectionForm(){const qs=['Nivel de aceite','Fugas de aceite','Fugas de aire','Presión','Temperatura','Ruido','Vibración','Enfriadores','Drenaje','Limpieza 5S','Gabinete eléctrico','Guardas','LOTO'];openM('Inspección de compresor',`<form onsubmit="addInspection(event)"><div class="field"><label>Compresor</label><select name="compressorId">${db.compressors.map(q=>`<option value="${q.id}">${x(q.code)} · ${x(q.name)}</option>`).join('')}</select></div><div class="list" style="margin-top:12px">${qs.map((q,i)=>`<div class="item flex"><span style="flex:1">${q}</span><select name="q${i}"><option>Correcto</option><option>Incorrecto</option><option>No aplica</option></select></div>`).join('')}</div><div class="field"><label>Hallazgo</label><textarea name="finding"></textarea></div><div class="field"><label>Fotografía</label><input name="photo" type="file" accept="image/*" capture="environment"></div><button class="btn primary" style="margin-top:12px">Guardar inspección</button></form>`)}async function addInspection(e){e.preventDefault();const fd=new FormData(e.target),f=Object.fromEntries(fd),a=Object.entries(f).filter(z=>z[0].startsWith('q')).map(z=>z[1]),bad=a.filter(z=>z==='Incorrecto').length;if(bad&&!f.finding)return note('Describa el hallazgo');db.inspections.unshift({id:uid('i'),compressorId:f.compressorId,date:new Date().toISOString().slice(0,10),score:Math.round((a.length-bad)/a.length*100),finding:f.finding,status:bad?'Con hallazgo':'Correcta',photo:await img(fd.get('photo'))});audit('Crear','Inspección');closeM();persist('Inspección guardada')}
function failures(){return head('Fallas, paros y causa','Seguimiento de confiabilidad',`<button class="btn danger" onclick="failureForm()">＋ Reportar falla</button>`)+`<div class="list">${db.failures.map(f=>`<div class="item"><div class="flex"><b>${x(f.folio)} · ${x(f.symptom)}</b><span style="margin-left:auto">${tag(f.status)}</span></div><div class="mut">${x(c(f.compressorId)?.name)} · ${x(f.component)}</div><div class="small">Inicio ${f.start} · Fin ${f.end||'Abierto'} · Paro ${dates(f.start,f.end).toFixed(1)} h</div><p>Causa: ${x(f.cause)} · Acción: ${x(f.action)}</p>${f.status!=='Cerrada'?`<button class="btn primary" onclick="closeFailure('${f.id}')">Cerrar falla</button>`:''}</div>`).join('')}</div>`}function failureForm(){openM('Reportar falla',`<form class="form" onsubmit="addFailure(event)"><div class="field full"><label>Compresor</label><select name="compressorId">${db.compressors.map(q=>`<option value="${q.id}">${x(q.code)} · ${x(q.name)}</option>`).join('')}</select></div>${field('Inicio','start',1,'datetime-local')}${field('Síntoma','symptom',1)}${field('Componente','component',1)}${pick('Prioridad','priority',['Media','Alta','Crítica'])}<div class="field full"><label>Causa probable</label><textarea name="cause"></textarea></div><div class="field full"><label>Acción inmediata</label><textarea name="action"></textarea></div><div class="field full"><button class="btn danger">Registrar falla</button></div></form>`)}function addFailure(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));db.failures.unshift({...f,id:uid('f'),folio:'F-'+String(db.failures.length+1).padStart(4,'0'),end:'',status:'Abierta'});audit('Crear','Falla '+f.symptom);closeM();persist('Falla registrada')}function closeFailure(fid){const f=db.failures.find(z=>z.id===fid);openM('Cerrar '+f.folio,`<form class="form" onsubmit="finishFailure(event,'${fid}')">${field('Fecha y hora final','end',1,'datetime-local')}<div class="field full"><label>Causa confirmada</label><textarea name="cause" required>${x(f.cause)}</textarea></div><div class="field full"><label>Acción correctiva</label><textarea name="action" required>${x(f.action)}</textarea></div><div class="field full"><button class="btn primary">Cerrar falla</button></div></form>`)}function finishFailure(e,fid){e.preventDefault();const v=Object.fromEntries(new FormData(e.target)),f=db.failures.find(z=>z.id===fid);Object.assign(f,v,{status:'Cerrada'});audit('Cerrar',f.folio);closeM();persist('Falla cerrada')}
function parts(){return head('Refacciones','Stock, costos y número de parte',`<button class="btn primary" onclick="partForm()">＋ Nueva refacción</button>`)+`<div class="panel"><table><thead><tr><th>Código</th><th>Descripción</th><th>Número parte</th><th>Stock</th><th>Mínimo</th><th>Costo</th><th>Ubicación</th><th></th></tr></thead><tbody>${db.parts.map(p=>`<tr><td><b>${x(p.code)}</b></td><td>${x(p.name)}</td><td>${x(p.partNo)}</td><td>${p.stock}</td><td>${p.min}</td><td>$${Number(p.cost).toLocaleString()}</td><td>${x(p.location)}</td><td>${p.stock<=p.min?tag('Crítica'):tag('Normal')} <button class="btn light" onclick="movePart('${p.id}')">Movimiento</button></td></tr>`).join('')}</tbody></table></div>`}function partForm(){openM('Nueva refacción',`<form class="form" onsubmit="addPart(event)">${field('Código','code',1)}${field('Descripción','name',1)}${field('Número de parte','partNo',1)}${field('Existencia','stock',1,'number')}${field('Stock mínimo','min',1,'number')}${field('Costo unitario','cost',1,'number')}${field('Ubicación','location',1)}<div class="field full"><button class="btn primary">Guardar refacción</button></div></form>`)}function addPart(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));['stock','min','cost'].forEach(k=>f[k]=+f[k]);db.parts.push({...f,id:uid('p')});audit('Crear','Refacción '+f.code);closeM();persist('Refacción registrada')}function movePart(pid){const p=db.parts.find(z=>z.id===pid);openM('Movimiento '+p.code,`<form class="form" onsubmit="partMovement(event,'${pid}')">${pick('Tipo','type',['Entrada','Salida'])}${field('Cantidad','qty',1,'number')}<div class="field full"><label>Motivo / OT</label><textarea name="reason" required></textarea></div><div class="field full"><button class="btn primary">Aplicar movimiento</button></div></form>`)}function partMovement(e,pid){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),p=db.parts.find(z=>z.id===pid),q=+f.qty;if(f.type==='Salida'&&q>p.stock)return note('Existencia insuficiente');p.stock+=f.type==='Entrada'?q:-q;db.movements.unshift({...f,id:uid('mv'),partId:pid,qty:q,date:new Date().toISOString()});audit('Movimiento',p.code+' '+f.type+' '+q);closeM();persist('Inventario actualizado')}
function kpis(){const m=metrics(),causes={};db.failures.forEach(f=>causes[f.component]=(causes[f.component]||0)+dates(f.start,f.end));const arr=Object.entries(causes).sort((a,b)=>b[1]-a[1]);return head('KPIs de mantenimiento','Indicadores calculados con datos locales')+`<div class="grid stats">${stat('Disponibilidad',m.availability.toFixed(2)+'%')}${stat('MTTR',m.mttr.toFixed(2)+' h')}${stat('Horas paro',m.down.toFixed(1))}${stat('Cumplimiento PM',m.pm.toFixed(0)+'%')}${stat('OT cerradas',m.closed)}${stat('Fallas',db.failures.length)}</div><div class="grid cards" style="margin-top:14px"><div class="panel" style="grid-column:span 2"><h3>Pareto de horas por componente</h3><div class="chart">${arr.map(([n,v])=>`<div class="col" style="height:${Math.max(8,Math.min(100,v/Math.max(1,...arr.map(z=>z[1]))*100))}%"><span>${x(n)}</span></div>`).join('')||'<span class="mut">Sin fallas cerradas suficientes.</span>'}</div></div><div class="panel"><h3>Criterios</h3><p class="small mut">Los KPI se calculan exclusivamente con registros locales. Las fallas abiertas no aportan tiempo de paro final ni MTTR hasta registrar su cierre.</p></div></div>`}

function qrPayloadFromData(d){return JSON.stringify({app:'AIRMAINT360',codigo:d.code,equipo:d.name,ubicacion:d.location,serie:d.serial||'',criticidad:d.criticality||''})}
function qrPayload(q){return qrPayloadFromData({code:q.code,name:q.name,location:[q.plant,q.area,q.location].filter(Boolean).join(' / '),serial:q.serial,criticality:q.criticality})}
function qrSVG(text,size=220){const qr=new window.QRCodeModel(0,1);qr.addData(text);qr.make();const n=qr.getModuleCount(),quiet=4,cell=size/(n+quiet*2);let r=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="white"/>`;for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(qr.isDark(y,x))r+=`<rect x="${(x+quiet)*cell}" y="${(y+quiet)*cell}" width="${cell+.05}" height="${cell+.05}" fill="#000"/>`;return r+'</svg>'}
function drawQR(id,text,size){const e=document.getElementById(id);if(e)e.innerHTML=qrSVG(text,size)}
function critLabel(v){return v==='A'?'A - CRÍTICO':v==='B'?'B - IMPORTANTE':'C - ESTÁNDAR'}
function labels(){const q=db.compressors[0];setTimeout(()=>{fillLabelFromAsset(q.id);updateLabelPreview()},40);return head('Diseñador de etiquetas QR','Edite los datos y revise la impresión antes de generar la etiqueta')+`<div class="designer"><section class="editor panel"><h3>Controles de la etiqueta</h3><div class="field"><label>Obtener datos del activo</label><select id="leAsset" onchange="fillLabelFromAsset(this.value)">${db.compressors.map(a=>`<option value="${a.id}">${x(a.code)} · ${x(a.name)}</option>`).join('')}</select></div><div class="form" style="margin-top:12px"><div class="field"><label>Código <em class="req">*</em></label><input id="leCode" maxlength="30" oninput="updateLabelPreview()"></div><div class="field"><label>Equipo <em class="req">*</em></label><input id="leName" maxlength="80" oninput="updateLabelPreview()"></div><div class="field full"><label>Ubicación <em class="req">*</em></label><input id="leLocation" maxlength="120" oninput="updateLabelPreview()"></div><div class="field"><label>Criticidad <em class="req">*</em></label><select id="leCriticality" onchange="updateLabelPreview()"><option>A</option><option>B</option><option>C</option></select></div><div class="field"><label>Serie</label><input id="leSerial" oninput="updateLabelPreview()"></div><div class="field"><label>Potencia HP</label><input id="lePower" type="number" oninput="updateLabelPreview()"></div><div class="field"><label>Voltaje</label><input id="leVoltage" type="number" oninput="updateLabelPreview()"></div><div class="field"><label>Presión PSI</label><input id="lePressure" type="number" oninput="updateLabelPreview()"></div><div class="field"><label>Tamaño</label><select id="leSize" onchange="updateLabelPreview()"><option value="100">10 × 10 cm</option><option value="150" selected>15 × 15 cm</option><option value="200">20 × 20 cm</option></select></div><div class="field"><label>Orientación</label><select id="leOrientation" onchange="updateLabelPreview()"><option value="vertical">Vertical</option><option value="horizontal">Horizontal</option></select></div></div><h4>Mostrar u ocultar</h4><div class="checks"><label><input id="showLocation" type="checkbox" checked onchange="updateLabelPreview()"> Ubicación</label><label><input id="showCriticality" type="checkbox" checked onchange="updateLabelPreview()"> Criticidad</label><label><input id="showSerial" type="checkbox" checked onchange="updateLabelPreview()"> Serie</label><label><input id="showPower" type="checkbox" checked onchange="updateLabelPreview()"> HP</label><label><input id="showVoltage" type="checkbox" checked onchange="updateLabelPreview()"> Voltaje</label><label><input id="showPressure" type="checkbox" checked onchange="updateLabelPreview()"> PSI</label></div><div id="labelValidation" class="validationBox" aria-live="polite"></div><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="updateLabelPreview()">Actualizar vista</button><button id="btnPrintLabel" class="btn light" onclick="printCurrentLabel()">Imprimir / PDF</button><button id="btnDownloadQR" class="btn light" onclick="downloadCurrentQR()">Descargar QR SVG</button></div><p class="mut small">Los cambios de esta pantalla afectan únicamente la etiqueta. No modifican el expediente del equipo.</p></section><section class="preview panel"><div class="previewtitle">VISTA PREVIA DE IMPRESIÓN</div><div id="singleLabel"></div></section></div>`}
function getLabelData(){return{code:leCode.value.trim(),name:leName.value.trim(),location:leLocation.value.trim(),criticality:leCriticality.value,serial:leSerial.value.trim(),power:lePower.value,voltage:leVoltage.value,pressure:lePressure.value,size:+leSize.value,orientation:leOrientation.value,showLocation:showLocation.checked,showCriticality:showCriticality.checked,showSerial:showSerial.checked,showPower:showPower.checked,showVoltage:showVoltage.checked,showPressure:showPressure.checked}}
function fillLabelFromAsset(id){const q=c(id);if(!q)return;leAsset.value=id;leCode.value=q.code||'';leName.value=q.name||'';leLocation.value=[q.plant,q.area,q.location].filter(Boolean).join(' / ');leCriticality.value=q.criticality||'C';leSerial.value=q.serial||'';lePower.value=q.power||'';leVoltage.value=q.voltage||'';lePressure.value=q.pressure||'';updateLabelPreview()}
function labelHTML(d){const crit=critLabel(d.criticality),tech=[d.showSerial&&d.serial?`SERIE: ${x(d.serial)}`:'',d.showPower&&d.power?`HP: ${x(d.power)}`:'',d.showVoltage&&d.voltage?`VOLTAJE: ${x(d.voltage)} V`:'',d.showPressure&&d.pressure?`PRESIÓN: ${x(d.pressure)} PSI`:''].filter(Boolean).join(' · ');return `<article id="printLabel" class="industrialLabel ${d.orientation} crit${d.criticality}" style="--label-size:${d.size}mm"><header><div class="ilBrand">AIRMAINT 360 PRO</div><div class="ilType">IDENTIFICACIÓN DE ACTIVO</div></header><div class="ilBody"><div class="ilQR" id="editableQR"></div><div class="ilData"><div class="ilField code"><span>CÓDIGO</span><b>${x(d.code)||'SIN CÓDIGO'}</b></div><div class="ilField equipment"><span>EQUIPO</span><b>${x(d.name)||'SIN NOMBRE'}</b></div>${d.showLocation?`<div class="ilField"><span>UBICACIÓN</span><b>${x(d.location)||'SIN UBICACIÓN'}</b></div>`:''}${d.showCriticality?`<div class="ilCritical">${crit}</div>`:''}</div></div>${tech?`<div class="ilTech">${tech}</div>`:''}<footer>ESCANEE PARA CONSULTAR LOS DATOS DEL EQUIPO</footer></article>`}
function validateLabelData(d,show=true){const errors=[];const fields={code:document.getElementById('leCode'),name:document.getElementById('leName'),location:document.getElementById('leLocation'),criticality:document.getElementById('leCriticality'),serial:document.getElementById('leSerial'),power:document.getElementById('lePower'),voltage:document.getElementById('leVoltage'),pressure:document.getElementById('lePressure')};Object.values(fields).forEach(e=>e&&e.classList.remove('invalid'));if(!d.code){errors.push('El código es obligatorio.');fields.code.classList.add('invalid')}else if(!/^[A-Za-z0-9._#\/-]{2,30}$/.test(d.code)){errors.push('El código debe tener 2 a 30 caracteres y solo letras, números, punto, guion, diagonal, numeral o guion bajo.');fields.code.classList.add('invalid')}if(!d.name){errors.push('El equipo es obligatorio.');fields.name.classList.add('invalid')}else if(d.name.length<3){errors.push('El nombre del equipo debe tener al menos 3 caracteres.');fields.name.classList.add('invalid')}if(!d.location){errors.push('La ubicación es obligatoria.');fields.location.classList.add('invalid')}else if(d.location.length<2){errors.push('La ubicación debe tener al menos 2 caracteres.');fields.location.classList.add('invalid')}if(!['A','B','C'].includes(d.criticality)){errors.push('Seleccione una criticidad válida.');fields.criticality.classList.add('invalid')}if(d.showSerial&&!d.serial){errors.push('La serie es obligatoria cuando está configurada para mostrarse.');fields.serial.classList.add('invalid')}for(const [key,label,enabled] of [['power','Potencia HP',d.showPower],['voltage','Voltaje',d.showVoltage],['pressure','Presión PSI',d.showPressure]]){const value=String(d[key]??'').trim();if(enabled&&!value){errors.push(`${label} es obligatorio cuando está configurado para mostrarse.`);fields[key].classList.add('invalid')}else if(value&&(!Number.isFinite(Number(value))||Number(value)<=0)){errors.push(`${label} debe ser un número mayor que cero.`);fields[key].classList.add('invalid')}}const box=document.getElementById('labelValidation');if(box&&show){box.className='validationBox '+(errors.length?'hasErrors':'valid');box.innerHTML=errors.length?`<b>Revise antes de imprimir:</b><ul>${errors.map(e=>`<li>${x(e)}</li>`).join('')}</ul>`:'<b>✓ Datos completos. La etiqueta está lista para imprimir.</b>'}const disabled=errors.length>0;const bp=document.getElementById('btnPrintLabel'),bd=document.getElementById('btnDownloadQR');if(bp)bp.disabled=disabled;if(bd)bd.disabled=disabled;return errors}
function updateLabelPreview(){if(!document.getElementById('singleLabel'))return;const d=getLabelData(),errors=validateLabelData(d,true);singleLabel.innerHTML=labelHTML(d);if(!errors.length)setTimeout(()=>drawQR('editableQR',qrPayloadFromData(d),260),10);else{const qr=document.getElementById('editableQR');if(qr)qr.innerHTML='<div class="qrBlocked">QR pendiente<br>Corrija los campos</div>'}}
function printCurrentLabel(){const d=getLabelData(),errors=validateLabelData(d,true);if(errors.length){note('Corrija los campos obligatorios antes de imprimir');return}updateLabelPreview();document.documentElement.style.setProperty('--print-label-size',leSize.value+'mm');document.body.classList.add('printingSingle');window.print();setTimeout(()=>document.body.classList.remove('printingSingle'),300)}
function downloadCurrentQR(){const d=getLabelData(),errors=validateLabelData(d,true);if(errors.length){note('Corrija los campos obligatorios antes de exportar');return}const svg=qrSVG(qrPayloadFromData(d),600),blob=new Blob([svg],{type:'image/svg+xml'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(d.code||'AIRMAINT')+'_QR.svg';a.click();URL.revokeObjectURL(a.href)}

function alertPage(){return head('Centro de alertas','Mantenimiento e inventario')+`<div class="list">${alerts().map(a=>`<div class="item flex"><div style="flex:1"><b>${x(a.name)}</b><div class="mut small">${x(a.q?.name||'Almacén')}</div></div>${tag(a.state)}</div>`).join('')||'<div class="panel mut">Sin alertas activas.</div>'}</div>`}
function reports(){return head('Reportes profesionales','CSV, impresión PDF y respaldo')+`<div class="grid cards">${[['Expediente de equipos','compressors'],['Horómetros','readings'],['Mantenimiento','maintenance'],['Órdenes con costos','orders'],['Inspecciones','inspections'],['Fallas y paros','failures'],['Refacciones','parts'],['Movimientos','movements']].map(([n,k])=>`<div class="card"><h3>${n}</h3><p class="mut">${db[k].length} registros</p><button class="btn primary" onclick="csv('${k}')">Descargar CSV</button></div>`).join('')}</div><div class="panel" style="margin-top:14px"><h3>Reporte ejecutivo PDF</h3><p class="mut">Imprime el dashboard actual o guárdalo como PDF desde el navegador.</p><button class="btn light" onclick="page='KPIs';render();setTimeout(()=>window.print(),200)">Generar vista ejecutiva</button></div>`}function csv(k){const r=db[k];if(!r.length)return note('No hay registros');const keys=[...new Set(r.flatMap(Object.keys))],s=[keys.join(','),...r.map(o=>keys.map(q=>'"'+String(o[q]??'').replaceAll('"','""')+'"').join(','))].join('\n');dl(k+'.csv',s,'text/csv')}
function settings(){return head('Configuración y seguridad','Respaldo integral y auditoría')+`<div class="grid cards"><div class="card"><h3>Respaldo completo</h3><p class="mut">Incluye datos y fotografías comprimidas.</p><button class="btn primary" onclick="backup()">Descargar JSON</button></div><div class="card"><h3>Restaurar</h3><p class="mut">Valida aplicación y estructura.</p><label class="btn light">Seleccionar respaldo<input type="file" accept=".json" hidden onchange="restore(event)"></label></div><div class="card"><h3>Datos demostración</h3><p class="mut">Reemplaza la base local actual.</p><button class="btn danger" onclick="resetDemo()">Restablecer</button></div></div><div class="panel" style="margin-top:14px"><h3>Auditoría local</h3>${db.audit.slice(0,30).map(a=>`<div class="small" style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${x(a.action)}</b> · ${x(a.detail)} · ${new Date(a.date).toLocaleString()}</div>`).join('')||'<p class="mut">Sin movimientos.</p>'}</div>`}function dl(n,d,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:t}));a.download=n;a.click();URL.revokeObjectURL(a.href)}function backup(){const p={app:'AIRMAINT 360 PRO Offline',version:'3.2.1',createdAt:new Date().toISOString(),data:db};dl('AIRMAINT_PRO_Backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(p),'application/json');db.settings.lastBackup=new Date().toISOString();audit('Exportar','Respaldo v3');persist('Respaldo descargado')}function restore(e){const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result);if(p.app!=='AIRMAINT 360 PRO Offline'||!p.data)throw 0;db=p.data;audit('Restaurar','Respaldo v3');persist('Respaldo restaurado')}catch{note('Respaldo inválido')}};r.readAsText(e.target.files[0])}function resetDemo(){if(confirm('¿Reemplazar todos los datos locales?')){db=clone(S);persist('Demostración restaurada')}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
